# Fly config — TEST (mercy-website-test). Deployed on push to `main`.
app = "mercy-website-test"
primary_region = "ord"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  COOKIE_SECURE = "true"
  TRUST_PROXY = "1"
  LOG_LEVEL = "info"
  DATABASE_PATH = "/data/mercy.sqlite"
  PUBLIC_DIR = "/data/public"
  UPLOAD_DIR = "/data/public/assets/img/uploads"

# Persistent volume. SQLite + uploads + generated site live here, so this app
# MUST run on a single machine (a volume is tied to one machine).
[[mounts]]
  source = "mercy_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
